
name: Deploy FRS Dispatch Lambda

on:
  workflow_dispatch:
  push:
    paths:
      - "aws/dispatch/**"
      - ".github/workflows/deploy-lambda.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: aws/dispatch
        run: npm ci

      - name: Generate Prisma Client
        working-directory: aws/dispatch
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Remove development dependencies
        working-directory: aws/dispatch
        run: npm prune --omit=dev

      - name: Create deployment ZIP
        working-directory: aws/dispatch
        run: |
          zip -r dispatch-lambda.zip index.mjs db.mjs node_modules
          ls -lh dispatch-lambda.zip

          SIZE=$(stat -c%s dispatch-lambda.zip)
          if [ "$SIZE" -gt 52428800 ]; then
            echo "ZIP exceeds Lambda's 50 MB direct upload limit."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name FRS-Dispatch-Lambda \
            --zip-file fileb://aws/dispatch/dispatch-lambda.zip
